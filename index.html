<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KS BHAI OFFICIAL</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --gold: #ffd21c;
    --darkgold: #d99a00;
    --black: #050505;
}

body {
    background: var(--black);
    color: white;
    font-family: Arial, sans-serif;
}

/* HEADER */

header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 6%;
    border-bottom: 2px solid var(--gold);
    background: #080808;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 22px;
    font-weight: bold;
}

.logo-circle {
    width: 48px;
    height: 48px;
    border: 2px solid var(--gold);
    border-radius: 50%;
    display: flex;
    justify-content: center;
    align-items: center;
    color: var(--gold);
    font-size: 23px;
    box-shadow: 0 0 15px #ffd21c50;
}

.logo span {
    color: var(--gold);
}

    padding: 65px 20px;

    border-bottom: 1px solid #705300;
}
